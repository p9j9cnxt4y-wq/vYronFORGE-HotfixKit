name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10','3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m pip wheel --no-deps . -w dist
      - run: python tools/verify_wheel.py dist
      - run: python -m unittest discover -s tests -v
      - run: python tools/verify_failure_atlas.py
      - run: python tools/release_gate_20.py
      - run: python tools/verify_policy.py
      - run: python tools/verify_source_coverage.py
      - run: python tools/publication_scan.py
      - run: python tools/verify_release_manifest.py
      - run: python tools/codex_path_integrity_regression.py
      - run: python tools/verify_execution_contract.py
      - run: python tools/test_vm2_guard.py
      - run: vyf-hotfix plan --inventory examples/inventory.example.json --out evidence/ci-report.json
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors=$null; $tokens=$null
          Get-ChildItem scripts/windows/*.ps1 | ForEach-Object {
            $errors=@(); $tokens=@()
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count -gt 0){ $errors | ForEach-Object ToString; exit 1 }
          }
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n scripts/linux/patch-security-updates.sh
          bash -n scripts/linux/mitigate-copy-fail.sh
          bash scripts/linux/mitigate-copy-fail.sh
          node --check scripts/node/vm2_guard.mjs
          python -m compileall -q src tools scripts/containment
